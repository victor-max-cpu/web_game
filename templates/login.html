<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>动作捕捉游戏 - 登录</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; }
        .login-container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 5px; }
        button.secondary { background-color: #6c757d; }
        button:hover { opacity: 0.9; }
        .error-msg {color: red; font-weight:bold;margin-bottom: 10px;}
        
        /* 弹窗样式 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; text-align: center; width: 300px; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .btn-register { background-color: #28a745; flex: 1; }
        .btn-retry { background-color: #007bff; flex: 1; }
        .close-btn { margin-top: 10px; background: none; border: none; color: #666; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>游戏登录</h2>
    <form method="POST" action="/login">
        <input type="text" name="username" placeholder="用户名 (必须唯一)" required>
        <input type="password" name="password" placeholder="密码" required>
        
        <!-- 登录按钮 -->
        <button type="submit" name="action" value="login">直接登录</button>
        <!-- 注册按钮 -->
        <button type="submit" name="action" value="register" class="secondary">新建玩家信息</button>
    </form>
</div>

{% if error %}
<div id="errorModal" class="modal" style="display: flex;">
  <div class="modal-content">
    <h3 style="color: #dc3545; margin-top: 0;">提示</h3>
    <p>{{ error }}</p>
    <div class="modal-buttons">
        <!-- 引导 a: 切换到注册模式 -->
        <button class="btn-register" onclick="switchToRegister()">去注册</button>
        <!-- 引导 b: 再试一次 (关闭弹窗) -->
        <button class="btn-retry" onclick="closeModal()">再试一次</button>
    </div>
  </div>
</div>
{% endif %}

<script>
    // 关闭弹窗
    function closeModal() {
        document.getElementById('errorModal').style.display = 'none';
        // 清空密码框，方便重试
        document.querySelector('input[name="password"]').value = '';
        document.querySelector('input[name="username"]').focus();
    }

    // 切换到注册模式：这里通过模拟点击“新建玩家信息”按钮来实现
    // 或者你可以修改表单的默认行为，这里采用最简单的触发第二个按钮
    function switchToRegister() {
        closeModal();
        // 找到表单中 value 为 'register' 的按钮并触发点击
        const registerBtn = document.querySelector('button[name="action"][value="register"]');
        if(registerBtn) {
            // 视觉反馈：可以加个高亮，或者直接聚焦到输入框
            document.querySelector('input[name="username"]').focus();
            alert("已切换至新建模式，请填写信息后点击“新建玩家信息”按钮。");
        }
    }
</script>

</body>
</html>
