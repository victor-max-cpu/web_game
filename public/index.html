<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动作闯关游戏 - 登录/注册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            overflow: hidden;
        }

        .tabs {
            display: flex;
            background: #f5f5f5;
        }

        .tab {
            flex: 1;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            color: #666;
        }

        .tab.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }

        .form-container {
            padding: 40px 30px;
        }

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 5px;
            text-align: center;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        .game-placeholder {
            display: none;
            text-align: center;
            padding: 60px 30px;
        }

        .game-placeholder.active {
            display: block;
        }

        .game-placeholder h1 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 32px;
        }

        .game-placeholder p {
            color: #666;
            margin-bottom: 30px;
            font-size: 18px;
        }

        .user-info {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 30px;
        }

        .user-info strong {
            color: #667eea;
        }

        .logout-btn {
            background: #dc3545;
            margin-top: 20px;
        }

        .logout-btn:hover {
            box-shadow: 0 5px 20px rgba(220, 53, 69, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 登录/注册标签页 -->
        <div class="tabs" id="tabs">
            <div class="tab active" data-tab="login">登录</div>
            <div class="tab" data-tab="register">注册</div>
        </div>

        <!-- 登录表单 -->
        <div class="form-container">
            <form class="form active" id="loginForm">
                <h2>用户登录</h2>
                <div class="input-group">
                    <label for="loginUsername">用户名</label>
                    <input type="text" id="loginUsername" required placeholder="请输入用户名">
                </div>
                <div class="input-group">
                    <label for="loginPassword">密码</label>
                    <input type="password" id="loginPassword" required placeholder="请输入密码">
                </div>
                <button type="submit">登录</button>
                <div class="message" id="loginMessage"></div>
            </form>

            <!-- 注册表单 -->
            <form class="form" id="registerForm">
                <h2>用户注册</h2>
                <div class="input-group">
                    <label for="registerUsername">用户名</label>
                    <input type="text" id="registerUsername" required placeholder="请设置用户名">
                </div>
                <div class="input-group">
                    <label for="registerPassword">密码</label>
                    <input type="password" id="registerPassword" required placeholder="请设置密码">
                </div>
                <div class="input-group">
                    <label for="confirmPassword">确认密码</label>
                    <input type="password" id="confirmPassword" required placeholder="请再次输入密码">
                </div>
                <button type="submit">注册</button>
                <div class="message" id="registerMessage"></div>
            </form>

            <!-- 游戏界面占位符 -->
            <div class="game-placeholder" id="gamePlaceholder">
                <h1>🎮 动作闯关游戏</h1>
                <div class="user-info">
                    欢迎，<strong id="currentUsername">玩家</strong>！
                </div>
                <p>游戏机制开发中...</p>
                <p>敬请期待！</p>
                <button class="logout-btn" onclick="logout()">退出登录</button>
            </div>
        </div>
    </div>

    <script>
        // 切换标签页
        const tabs = document.querySelectorAll('.tab');
        const forms = document.querySelectorAll('.form');
        const gamePlaceholder = document.getElementById('gamePlaceholder');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const targetTab = tab.dataset.tab;
                
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                forms.forEach(f => f.classList.remove('active'));
                document.getElementById(targetTab + 'Form').classList.add('active');
                
                hideMessage('loginMessage');
                hideMessage('registerMessage');
            });
        });

        // 显示消息
        function showMessage(elementId, message, isSuccess) {
            const messageEl = document.getElementById(elementId);
            messageEl.textContent = message;
            messageEl.className = 'message ' + (isSuccess ? 'success' : 'error');
        }

        // 隐藏消息
        function hideMessage(elementId) {
            const messageEl = document.getElementById(elementId);
            messageEl.className = 'message';
            messageEl.textContent = '';
        }

        // 登录表单提交
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.user.username);
                    showGameInterface();
                } else {
                    showMessage('loginMessage', data.message, false);
                }
            } catch (error) {
                showMessage('loginMessage', '网络错误，请稍后重试', false);
                console.error('Login error:', error);
            }
        });

        // 注册表单提交
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('registerUsername').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                showMessage('registerMessage', '两次输入的密码不一致', false);
                return;
            }

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('registerMessage', '注册成功！即将自动登录...', true);
                    setTimeout(() => {
                        localStorage.setItem('token', 'mock-token-' + Date.now());
                        localStorage.setItem('username', username);
                        showGameInterface();
                    }, 1000);
                } else {
                    showMessage('registerMessage', data.message, false);
                }
            } catch (error) {
                showMessage('registerMessage', '网络错误，请稍后重试', false);
                console.error('Register error:', error);
            }
        });

        // 显示游戏界面
        function showGameInterface() {
            forms.forEach(f => f.classList.remove('active'));
            document.getElementById('tabs').style.display = 'none';
            gamePlaceholder.classList.add('active');
            document.getElementById('currentUsername').textContent = localStorage.getItem('username');
        }

        // 退出登录
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            forms[0].classList.add('active');
            document.getElementById('tabs').style.display = 'flex';
            gamePlaceholder.classList.remove('active');
            document.getElementById('loginUsername').value = '';
            document.getElementById('loginPassword').value = '';
            hideMessage('loginMessage');
            hideMessage('registerMessage');
        }

        // 检查是否已登录
        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            if (token) {
                showGameInterface();
            }
        });
    </script>
</body>
</html>
